name: CI

# Push is limited to main rather than every branch. With `branches: ['**']` a
# branch that has a pull request open matches both triggers and runs the whole
# suite twice for one commit — including two Chromium downloads and two browser
# runs. Branches are still covered: the pull_request trigger tests them, against
# the merge result rather than the branch tip.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Every scraper test runs against saved HTML fixtures, offline. No Amazon
      # account and no credentials are ever involved in CI.
      - name: Unit tests
        run: npm test

      - run: npm run build

      - name: Install Chromium for the browser test
        run: npx playwright install --with-deps chromium

      # Loads the built extension in real Chromium and drives the actual UI:
      # imports a CSV, re-imports it to prove nothing duplicates, parses an
      # Amazon page and checks returned money is excluded, links a duplicate
      # purchase, and round-trips the CSV export.
      - name: Browser smoke test
        run: npm run smoke

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v7
        with:
          name: expenseplanner-unpacked
          path: dist/
          retention-days: 14
