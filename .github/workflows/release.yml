# Release — expensePlanner
#
# Trigger: pushing a tag vX.Y.Z (e.g. v1.4.0) that points at a commit on main.
# The tag is the ONLY source of the version: the build writes it into
# dist/manifest.json (public/manifest.json and package.json stay at 0.0.0), and
# the GitHub Release is named after it.
#
#   git checkout main && git pull
#   git tag v1.4.0 && git push origin v1.4.0
#
# Jobs:
#   1. verify  — tag is vX.Y.Z (no leading zeros) and its commit is on main.
#   2. build   — typecheck, lint, unit tests, build stamped with the version,
#                browser test, zip, then the browser test again against the
#                unzipped zip: the file people and the store actually get.
#   3. release — GitHub Release for the tag (generated notes, the zip and its
#                checksum).
#   4. chrome  — Chrome Web Store. Runs in the `release` environment (owner
#                approval gate + store secret) and skips, without failing,
#                until its settings exist; see docs/chrome-web-store-setup.md.
#                The `release` environment must allow tags matching v*
#                (Settings → Environments → release → Deployment branches and
#                tags), or this job can't start.
#
# A store failure never blocks the GitHub Release: the store job runs after it.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the tag is vX.Y.Z on main
        id: version
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z (e.g. v1.4.0, no leading zeros). No release made."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG#v} from $GITHUB_SHA"

  build:
    runs-on: ubuntu-latest
    needs: verify
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and unit tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build
        run: npm run build

      - name: Check the build carries the tag's version
        run: |
          got=$(node -p "require('./dist/manifest.json').version")
          echo "dist: $got"
          if [ "$got" != "$RELEASE_VERSION" ]; then
            echo "::error::dist/manifest.json has version $got, expected $RELEASE_VERSION"
            exit 1
          fi

      - name: Install Chromium for the browser test
        run: npx playwright install --with-deps chromium

      - name: Browser test
        run: npm run smoke

      - name: Package the zip and its checksum
        run: npm run package

      # Verify the file people will actually download, not just the build
      # directory it came from.
      - name: Check the zip installs and works
        run: |
          mkdir -p /tmp/release-check
          unzip -q "release/expenseplanner-${RELEASE_VERSION}-chrome.zip" -d /tmp/release-check
          node scripts/smoke.mjs /tmp/release-check

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [verify, build]
    permissions:
      contents: write   # create the Release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@v5
        with:
          name: release-files
          path: out

      - name: Create the GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v$VERSION" \
            --generate-notes \
            --notes "expensePlanner v$VERSION.

          - \`expenseplanner-$VERSION-chrome.zip\`: the Chrome extension. This is the Chrome Web Store upload, and can also be installed by hand.
          - \`SHA256SUMS.txt\`: its checksum.

          To install by hand: unzip it, open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and choose the unzipped folder.

          All data stays on your computer. Nothing is uploaded anywhere."

  chrome:
    # Chrome Web Store (API v2, scripts/publish-chrome.mjs): uploads the
    # release's zip and submits it for review as STAGED_PUBLISH, so a reviewed
    # update waits for the owner's Publish click in the Developer Dashboard.
    # Runs in the `release` environment (owner approval). Skips, without
    # failing, until the service account key and IDs are set
    # (docs/chrome-web-store-setup.md, step 4).
    runs-on: ubuntu-latest
    needs: [verify, release]
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check Chrome Web Store settings
        id: cws
        # Secrets go in through env, never pasted into the script itself.
        env:
          CWS_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON_B64 }}
          CWS_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUB: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          if [ -n "$CWS_JSON" ] && [ -n "$CWS_ID" ] && [ -n "$CWS_PUB" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.cws.outputs.configured == 'true'
        uses: actions/checkout@v5

      - name: Set up Node 22
        if: steps.cws.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download release files
        if: steps.cws.outputs.configured == 'true'
        uses: actions/download-artifact@v5
        with:
          name: release-files
          path: out

      - name: Upload to the Chrome Web Store and submit for review
        if: steps.cws.outputs.configured == 'true'
        env:
          CWS_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON_B64 }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_PUBLISH_TYPE: STAGED_PUBLISH
        run: node scripts/publish-chrome.mjs "out/expenseplanner-${VERSION}-chrome.zip"

      - name: Skip (not set up yet)
        if: steps.cws.outputs.configured != 'true'
        run: |
          echo "SKIPPED: Chrome Web Store upload. Set the CWS_SERVICE_ACCOUNT_JSON_B64 secret and the CWS_EXTENSION_ID and CWS_PUBLISHER_ID variables (docs/chrome-web-store-setup.md); not a failure."
