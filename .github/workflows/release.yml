name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # A tag that disagrees with the manifest ships a build that installs but
      # never updates, so it fails the release rather than producing one.
      - name: Check the tag matches the manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./public/manifest.json').version")
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG manifest=$MANIFEST package=$PKG"
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match manifest.json ($MANIFEST) and package.json ($PKG)."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Install Chromium for the browser test
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run smoke

      - name: Package
        run: npm run package

      # Verify the artifact people will actually download, not just the build
      # directory it came from.
      - name: Verify the release zip installs and works
        run: |
          mkdir -p /tmp/release-check
          unzip -q "release/expenseplanner-${GITHUB_REF_NAME#v}.zip" -d /tmp/release-check
          node scripts/smoke.mjs /tmp/release-check

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          body: |
            ## Installing

            1. Download `expenseplanner-${{ github.ref_name }}.zip` below and unzip it.
            2. Open `chrome://extensions` and turn on **Developer mode** (top right).
            3. Click **Load unpacked** and choose the unzipped folder.

            To update later, download the new zip, replace the folder, and press
            the reload icon on the extension card.

            Chrome has refused to install `.crx` files from outside the Web Store
            since 2015, so there is deliberately no `.crx` here — it would look
            right and fail on your machine. `-webstore.zip` is the same build
            packaged for a Chrome Web Store upload.

            All data stays on your computer. Nothing is uploaded anywhere.
