# Pages — publishes the site (site/) to GitHub Pages.
#
# Plain static files, no build step. Runs when site/ changes on main, or by
# hand. One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# The site is then at https://megahirt.github.io/expensePlanner/ and the
# privacy policy at https://megahirt.github.io/expensePlanner/privacy.html
#
# Screenshots in site/img/ are made with `npm run store:assets` and committed;
# this workflow does not regenerate them.

name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site/
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
